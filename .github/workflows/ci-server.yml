name: CI LBA Print Server (pytest)
on:
  push:
    branches: [main, feature/lba-print-foundation, fix/odoo19-addon-qa-layouts]
  pull_request:

jobs:
  test-server:
    name: Servidor — API, cola, rendering, simulador
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - name: Dependencias
        run: python -m pip install -r server/requirements-dev.txt
      - name: Suite pytest
        run: cd server && python -m pytest tests -q
      - name: Suite de scripts de despliegue
        run: python3 -m unittest discover -s deploy/tests -v
      - name: Tests Node del addon
        run: node --test odoo_addons/lba_print_connector/tests/*.mjs
      - name: Smoke end-to-end (simulador + API + worker + panel)
        env:
          LBA_ADMIN_PASSWORD: admin1234
          LBA_API_TOKEN: lba_ci_token
        run: bash deploy/scripts/demo_walkthrough.sh
      - name: Construir paquetes reproducibles del SHA probado
        run: python deploy/scripts/build_packages.py --output "$RUNNER_TEMP/lba-packages"
      - name: Publicar paquetes QA y SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: lba-packages-${{ github.sha }}
          if-no-files-found: error
          path: ${{ runner.temp }}/lba-packages/*
