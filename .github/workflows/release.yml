name: Release — paquetes, addon Odoo e imagen Docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versión sin prefijo v (debe coincidir con el archivo VERSION)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/lean031110/lba-print-system

jobs:
  publish:
    name: Publicar release verificada
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt

      - name: Dependencias de prueba
        run: python -m pip install -r server/requirements-dev.txt

      - name: Gate — suite del servidor y del despliegue
        run: |
          set -o pipefail
          cd server && python -m pytest tests -q
          cd ..
          python3 -m unittest discover -s deploy/tests -v

      - name: Gate — tests Node del addon
        run: node --test odoo_addons/lba_print_connector/tests/*.mjs

      - name: Resolver la versión y validar VERSION
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          else
            VERSION="${VERSION_INPUT}"
            TAG="v${VERSION}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error title=Versión inválida::$VERSION no es semver"
            exit 1
          fi
          FILE_VERSION="$(cat VERSION)"
          if [[ "$VERSION" != "$FILE_VERSION" ]]; then
            echo "::error title=VERSION desincronizado::tag=$VERSION archivo=$FILE_VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Versión de release: $VERSION ($TAG)"

      - name: Construir paquetes del commit tageado
        run: |
          python deploy/scripts/build_packages.py \
            --output "$RUNNER_TEMP/release" \
            --revision "$GITHUB_SHA"
          python deploy/scripts/build_install_bundle.py \
            --output "$RUNNER_TEMP/release" \
            --revision "$GITHUB_SHA" \
            --version "${{ steps.version.outputs.version }}"

      - name: Checksums del conjunto
        working-directory: ${{ runner.temp }}/release
        run: |
          set -euo pipefail
          ls -l
          sha256sum lba-print-server-*.tar.gz \
                    lba_print_connector-*.zip \
                    lba-print-system-*-install.tar.gz \
                    MANIFEST.txt > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Publicar imagen en GHCR
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          refs=("$IMAGE:$VERSION" "$IMAGE:sha-${GITHUB_SHA::12}")
          if [[ "$VERSION" != *-* ]]; then
            refs+=("$IMAGE:latest")
          fi
          args=()
          for ref in "${refs[@]}"; do
            args+=(-t "$ref")
          done
          docker build --build-arg LBA_VERSION="$VERSION" "${args[@]}" \
            -f docker/Dockerfile .
          for ref in "${refs[@]}"; do
            docker push "$ref"
          done
          docker image inspect "$IMAGE:$VERSION" --format 'imagen: {{.Id}} {{.Size}} bytes'

      - name: Crear o actualizar la release con todos los artefactos
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "La release $TAG ya existe; actualizando artefactos."
            gh release upload "$TAG" "$RUNNER_TEMP"/release/* --clobber
          else
            gh release create "$TAG" \
              --verify-tag \
              --title "LBA Print System $VERSION" \
              --notes-file docs/RELEASE_NOTES.md \
              "$RUNNER_TEMP"/release/*
          fi

      - name: Resumen
        run: |
          {
            echo "### Release ${{ steps.version.outputs.tag }}"
            echo
            echo "| Artefacto | SHA-256 |"
            echo "|---|---|"
            (cd "$RUNNER_TEMP/release" && while read -r sum name; do echo "| \`$name\` | \`$sum\` |"; done < SHA256SUMS)
            echo
            echo "Imagen: \`$IMAGE:${{ steps.version.outputs.version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
