name: CI estrés y concurrencia — cola, idempotencia y workers

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stress:
    name: Estrés — ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 300 trabajos / 3 workers / 3 impresoras
            args: >-
              --jobs 300 --duplicates 30 --burst 10
              --concurrency 24 --workers 3 --printers 3 --timeout 180
          - name: 150 trabajos / 1 worker / 1 impresora
            args: >-
              --jobs 150 --duplicates 20 --burst 8
              --concurrency 8 --workers 1 --printers 1 --timeout 240
          - name: ráfaga de idempotencia (80 claves x 16 envíos)
            args: >-
              --jobs 40 --duplicates 80 --burst 16
              --concurrency 32 --workers 2 --printers 2 --timeout 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - name: Dependencias del servidor
        run: python -m pip install -r server/requirements-dev.txt
      - name: Prueba de estrés con impresoras virtuales
        run: |
          python deploy/scripts/stress_test.py ${{ matrix.args }} \
            --report "$RUNNER_TEMP/lba-stress-report.json"
      - name: Publicar informe de estrés
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lba-stress-${{ strategy.job-index }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/lba-stress-report.json
