name: CI Docker — imagen y prueba de humo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-image:
    name: Imagen Docker — build y smoke real (API + worker + impresora virtual)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de la prueba
        run: |
          python3 -c 'import json, sys; print(sys.version)'
          curl --version | head -1

      - name: Construir la imagen y ejecutar la prueba de humo
        env:
          LBA_SMOKE_PORT: "18000"
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/docker-smoke.log"
          set +e
          bash deploy/ci/docker_smoke_test.sh lba-print:ci 2>&1 | tee "$LOG"
          rc=${PIPESTATUS[0]}
          set -e
          if (( rc != 0 )); then
            message="$(tail -c 4000 "$LOG" | tr '\n' '|' | tr -d '\r')"
            echo "::error title=Smoke Docker falló::$message"
            exit "$rc"
          fi

      - name: Diagnóstico si falla
        if: failure()
        run: |
          docker images | head -5
          docker ps -a | head -10
